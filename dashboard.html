<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Dashboard สรุปผล | Pest Inspect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- ไลบรารี Export (โหลดแบบ defer) -->
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <main class="container container-wide">
    <div class="page-head">
      <div>
        <h1>Dashboard สรุปผลประจำเดือน</h1>
        <p class="muted" id="periodLabel">—</p>
      </div>
    </div>

    <!-- ตัวเลือกเดือน/ปี + Export -->
    <section class="card toolbar-card">
      <div class="period-picker">
        <div>
          <label class="label" for="monthSel">เดือน</label>
          <select id="monthSel" class="input"></select>
        </div>
        <div>
          <label class="label" for="yearSel">ปี (พ.ศ.)</label>
          <select id="yearSel" class="input"></select>
        </div>
        <button class="btn btn-primary" id="viewBtn" type="button">🔎 ดูข้อมูล</button>
      </div>
      <div class="export-box">
        <span class="label">Export รายงานเดือนที่เลือก</span>
        <div class="btn-row">
          <button class="btn btn-export pdf" id="exportPdf" type="button">📄 PDF</button>
          <button class="btn btn-export xlsx" id="exportXlsx" type="button">📗 Excel</button>
          <button class="btn btn-export csv" id="exportCsv" type="button">📑 CSV</button>
        </div>
      </div>
    </section>

    <!-- การ์ดสรุป -->
    <section class="stat-grid">
      <div class="stat-card"><div class="stat-label">ร้านทั้งหมด</div><div class="stat-value" id="statTotal">0</div></div>
      <div class="stat-card ok"><div class="stat-label">ตรวจแล้ว</div><div class="stat-value" id="statDone">0</div></div>
      <div class="stat-card warn"><div class="stat-label">ยังไม่ได้ตรวจ</div><div class="stat-value" id="statPending">0</div></div>
      <div class="stat-card"><div class="stat-label">จำนวนครั้งที่บันทึก</div><div class="stat-value" id="statRecords">0</div></div>
    </section>
    <section class="card">
      <div class="progress-head">
        <span><b>ความคืบหน้าการตรวจ</b></span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="floor-progress" id="floorProgress"></div>
    </section>

    <!-- สถิติศัตรูพืช -->
    <section class="card">
      <div class="card-title">สถิติการพบศัตรูพืช (สะสมทั้งเดือน)</div>
      <p class="hint">นับจากร้านที่ตรวจแล้ว · กดการ์ด "พบ..." เพื่อดูรายละเอียดและรูปภาพ</p>
      <div class="pest-grid">
        <div class="pest-group">
          <h4>🐀 หนู</h4>
          <div class="pest-cards">
            <button type="button" class="pest-card found" id="ratFound">
              <span class="pest-label">พบหนู</span><span class="pest-value">0</span><span class="pest-unit">ร้าน · ดูรายละเอียด ›</span>
            </button>
            <div class="pest-card clear" id="ratClear">
              <span class="pest-label">ไม่พบหนู</span><span class="pest-value">0</span><span class="pest-unit">ร้าน</span>
            </div>
          </div>
        </div>
        <div class="pest-group">
          <h4>🪳 แมลงสาบ</h4>
          <div class="pest-cards">
            <button type="button" class="pest-card found" id="roachFound">
              <span class="pest-label">พบแมลงสาบ</span><span class="pest-value">0</span><span class="pest-unit">ร้าน · ดูรายละเอียด ›</span>
            </button>
            <div class="pest-card clear" id="roachClear">
              <span class="pest-label">ไม่พบแมลงสาบ</span><span class="pest-value">0</span><span class="pest-unit">ร้าน</span>
            </div>
          </div>
        </div>
      </div>
      <div class="method-stats" id="methodStats"></div>
    </section>

    <!-- รายชื่อร้านแยกสถานะ -->
    <section class="card">
      <div class="seg-tabs" role="tablist">
        <button type="button" class="seg-tab active" data-tab="done" role="tab">✅ ตรวจแล้ว <span class="count" id="tabDoneCount">0</span></button>
        <button type="button" class="seg-tab" data-tab="pending" role="tab">⏳ ยังไม่ได้ตรวจ <span class="count" id="tabPendingCount">0</span></button>
      </div>
      <div class="list-tools">
        <input type="search" id="listSearch" class="input" placeholder="🔍 ค้นหารหัสหรือชื่อร้าน">
      </div>
      <div class="floor-tabs" id="listFloorTabs" role="tablist"></div>
      <div id="storeTable"></div>
      <div class="pagination" id="listPager"></div>
    </section>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
