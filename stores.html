<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>จัดการร้านค้า | Pest Inspect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
  <main class="container container-wide">
    <div class="page-head">
      <div>
        <h1>จัดการรายชื่อร้านค้า</h1>
        <p class="muted">สำหรับผู้ดูแลระบบ (Admin) เท่านั้น</p>
      </div>
    </div>

    <!-- Login -->
    <section class="card login-card hidden" id="loginCard">
      <div class="card-title">🔐 เข้าสู่ระบบ Admin</div>
      <form id="loginForm">
        <label class="label" for="email">อีเมล</label>
        <input type="email" id="email" class="input" autocomplete="username" required>
        <label class="label" for="password">รหัสผ่าน</label>
        <input type="password" id="password" class="input" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary btn-block mt" id="loginBtn">เข้าสู่ระบบ</button>
      </form>
      <p class="hint">บัญชี Admin สร้างได้ที่ Supabase → Authentication → Users</p>
    </section>

    <!-- Manager -->
    <section class="hidden" id="manager">
      <div class="card">
        <div class="list-toolbar">
          <input type="search" id="search" class="input" placeholder="🔍 ค้นหารหัสหรือชื่อร้าน">
          <select id="statusFilter" class="input">
            <option value="all">ทุกสถานะ</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          <button type="button" class="btn btn-ghost" id="sortBtn">⇅ ชั้น B → 6</button>
          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="addBtn">➕ เพิ่มร้านค้า</button>
            <label class="btn btn-outline">⬆️ นำเข้า CSV<input type="file" id="importCsv" accept=".csv,text/csv" hidden></label>
          </div>
        </div>
        <div class="floor-tabs" id="floorTabs" role="tablist"></div>
        <div id="table"></div>
        <div class="pagination" id="pager"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/stores.js"></script>
</body>
</html>
