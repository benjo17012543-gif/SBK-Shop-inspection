<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>บันทึกการตรวจร้านค้า | Pest Inspect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>บันทึกการตรวจร้านค้า</h1>
        <p class="muted">บันทึกผลการตรวจหนูและแมลงสาบ</p>
      </div>
      <div class="clock" id="clock" aria-label="วันและเวลาปัจจุบัน"></div>
    </div>

    <form id="inspectionForm" novalidate>
      <!-- 1. เลือกร้านค้า -->
      <section class="card" id="storeSection">
        <div class="card-title"><span class="step">1</span>เลือกร้านค้า <span class="req">*</span></div>

        <div id="selectedStore" class="selected-store hidden"></div>

        <div id="storePicker">
          <div class="search-box">
            <input type="search" id="storeSearch" placeholder="🔍 ค้นหารหัสหรือชื่อร้าน (ค้นหาทุกชั้น)" autocomplete="off">
          </div>
          <div class="floor-tabs" id="floorTabs" role="tablist" aria-label="เลือกชั้น"></div>
          <div class="store-grid" id="storeList"></div>
          <div class="pagination" id="storePager"></div>
        </div>
      </section>

      <!-- 2. ปัญหาที่พบ -->
      <section class="card">
        <div class="card-title"><span class="step">2</span>ปัญหาที่พบ <span class="req">*</span></div>
        <select id="problem" class="input" required>
          <option value="">— เลือกปัญหาที่พบ —</option>
        </select>
      </section>

      <!-- 3. วิธีการแก้ไข -->
      <section class="card" id="solutionSection">
        <div class="card-title"><span class="step">3</span>วิธีการแก้ไขปัญหา <span class="req">*</span></div>
        <label class="label" for="solutionMethod">เลือกวิธีแก้ไข</label>
        <select id="solutionMethod" class="input">
          <option value="">— เลือกวิธีแก้ไข —</option>
        </select>
        <label class="label" for="solutionDetail">รายละเอียดวิธีแก้ไขปัญหา <span id="detailReq" class="req hidden">*</span></label>
        <textarea id="solutionDetail" class="input" rows="3" placeholder="เช่น จุดที่วางเหยื่อ จำนวนกรง ปริมาณเจล ฯลฯ"></textarea>
      </section>

      <!-- 4. รูปภาพ -->
      <section class="card">
        <div class="card-title"><span class="step">4</span>รูปภาพประกอบ <span class="muted small" id="photoCount"></span></div>
        <div class="btn-row">
          <label class="btn btn-outline">
            📷 ถ่ายภาพ
            <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
          </label>
          <label class="btn btn-outline">
            🖼️ เลือกจากคลังภาพ
            <input type="file" id="galleryInput" accept="image/*" multiple hidden>
          </label>
        </div>
        <p class="hint">ระบบจะบีบอัดรูปอัตโนมัติก่อนอัปโหลด เพื่อประหยัดพื้นที่และโหลดเร็ว</p>
        <div class="photo-grid" id="photoGrid"></div>
      </section>

      <!-- 5. ลายเซ็น -->
      <section class="card">
        <div class="card-title"><span class="step">5</span>ผู้ตรวจและลายเซ็น <span class="req">*</span></div>
        <label class="label" for="inspectorName">ชื่อพนักงานผู้ตรวจ</label>
        <input type="text" id="inspectorName" class="input" placeholder="ชื่อ-นามสกุล" autocomplete="name" required>
        <label class="label">ลายเซ็นพนักงาน</label>
        <div class="sig-wrap">
          <canvas id="sigCanvas" class="sig-canvas" aria-label="ช่องเซ็นชื่อ"></canvas>
          <span class="sig-placeholder" id="sigPlaceholder">เซ็นชื่อที่นี่</span>
        </div>
        <div class="btn-row end">
          <button type="button" class="btn btn-ghost btn-sm" id="clearSig">🧽 ล้างลายเซ็น</button>
        </div>
      </section>

      <!-- 6. หมายเหตุ -->
      <section class="card">
        <div class="card-title"><span class="step">6</span>หมายเหตุเพิ่มเติม</div>
        <textarea id="remarks" class="input" rows="3" placeholder="ข้อสังเกตอื่นๆ (ถ้ามี)"></textarea>
        <p class="hint">🕒 วันที่และเวลาบันทึกจะถูกบันทึกอัตโนมัติเมื่อกดบันทึก</p>
      </section>

      <div class="submit-bar">
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn">💾 บันทึกการตรวจ</button>
      </div>
    </form>
  </main>

  <script type="module" src="js/inspection.js"></script>
</body>
</html>
